<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Forget Password</title>
</head>
<body>
    <div class="container">
        <section class="right">
            <div class="brand">
                ♥ ANI Care Rescue Portal
            </div>

            <h1>Forget Password?
            </h1>
            <p class="subtitle">
                Enter your email address to reset your password.
            </p>

            <form id="forgotform" action="forgot_password_process.php" method="POST" novalidate>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="hello@gmail.com" autocomplete="email" required>
                <small class="error" id="emailError"></small>
                <button type="submit">Reset Password</button>

                <p id="formMessage" role="status" aria-live="polite"></p>


            </form>
            <p class="register">
                Remember your Password?<br>
                <a href="login.html">Return to login</a>
            </p>
        </section>
    </div>
    <script src="forgot_password.js"></script>
</body>
</html>
